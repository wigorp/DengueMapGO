<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>DengueMap GO</title>

<link rel="stylesheet" href="style.css">

<!-- CHART -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- GOOGLE MAPS -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBYe-b5lY0GTN57mmB8fO97D7x54b2FaDk&libraries=visualization&callback=init" async defer></script>

</head>

<body>

<h1>DengueMap GO - Monitoramento Inteligente</h1>

<div class="dashboard">

  <div class="card">
    <h3>Total de Casos</h3>
    <p id="total">0</p>
  </div>

  <div class="card">
    <h3>Setor Crítico</h3>
    <p id="critico">-</p>
  </div>

  <div class="card">
    <h3>Prioridade Vacinação</h3>
    <p id="vacina">-</p>
  </div>

</div>

<h2>Relatório de Casos por Setor</h2>
<canvas id="grafico"></canvas>

<div class="controls">
  <select id="filtro">
    <option>Selecione um setor</option>
  </select>
</div>

<div id="map"></div>

<h2>Ranking de Setores</h2>
<table id="ranking">
  <thead>
    <tr>
      <th>Posição</th>
      <th>Setor</th>
      <th>Casos</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script src="script.js"></script>

</body>
</html>
