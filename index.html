<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>DengueMap GO</title>

<link rel="stylesheet" href="style.css">

<!-- CHART -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- GOOGLE MAPS -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBYe-b5lY0GTN57mmB8fO97D7x54b2FaDk&callback=init" async defer></script>

</head>

<body>

<div class="container">

  <!-- TOPO -->
  <div class="top-bar">
    <h1>DengueMap GO - Monitoramento Inteligente</h1>

    <div class="filtro-topo">
      <label>Selecionar Setor:</label>
      <select id="filtro"></select>
    </div>
  </div>

  <!-- GRID 3 COLUNAS -->
  <div class="grid-3">

    <!-- COLUNA 1 -->
    <div class="dashboard">
      <div class="card">
        <h3>Total de Casos</h3>
        <p id="total"></p>
      </div>

      <div class="card">
        <h3>Setor Crítico</h3>
        <p id="critico"></p>
      </div>

      <div class="card">
        <h3>Prioridade Vacinação</h3>
        <p id="vacina"></p>
      </div>
    </div>

    <!-- COLUNA 2 -->
    <div class="grafico-container">
      <h2>Relatório de Casos por Setor</h2>
      <canvas id="grafico"></canvas>

      <h3>Ranking de Setores</h3>
      <table id="ranking">
        <thead>
          <tr>
            <th>Posição</th>
            <th>Setor</th>
            <th>Casos</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- COLUNA 3 -->
    <div class="map-container">
      <h2>Mapa de Focos</h2>
      <div id="map"></div>
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
